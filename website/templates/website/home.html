<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django AWS DevOps Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 750px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1f4e79;
        }

        p {
            color: #444;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            background: #e5f7e9;
            color: #176b35;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Django AWS DevOps Project</h1>

        <p>
            Welcome to our containerized Django application.
        </p>

        <p>
            This application will be deployed using Docker,
            Amazon ECR, Amazon ECS Fargate, and AWS CI/CD services.
        </p>

        <div class="status">
            Application Running
        </div>
    </div>
</body>
</html>
